name = "adeel-dev-platform"
# NOTE: Set your account_id in the Cloudflare Dashboard or provide it to the deploy command.
# account_id = "<YOUR_ACCOUNT_ID>"

compatibility_date = "2026-08-01"

# Worker entrypoint - this is the single Worker script that routes /api/chat and
# delegates static asset requests to the ASSETS binding for the Angular SPA.
main = "worker/index.js"

# Static assets configuration (Angular production output). Wrangler will upload
# files from this directory and provide an ASSETS binding available to the Worker.
[assets]
directory = "frontend/dist/frontend/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"

# IMPORTANT: Cloudflare CI / your Pages pipeline should run the frontend build step
# before running `npx wrangler deploy`. Do NOT duplicate the build here. Removing
# the `[build]` command prevents Wrangler from attempting `cd frontend && npm ci && npm run build`
# which caused the previous deployment error in the CI environment where the working
# directory differed.
