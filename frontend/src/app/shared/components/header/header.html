<header class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-slate-800/80">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center space-x-2 group">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20 group-hover:scale-105 transition-transform duration-300">
            AS
          </div>
          <span class="text-sm font-semibold tracking-wide text-slate-100 group-hover:text-blue-400 transition-colors">
            adeelsattar<span class="text-blue-500">.dev</span>
          </span>
        </a>
      </div>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex space-x-1">
        <a routerLink="/" fragment="about" class="px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/40 transition-all duration-200">About</a>
        <a routerLink="/" fragment="skills" class="px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/40 transition-all duration-200">Skills</a>
        <a routerLink="/" fragment="projects" class="px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/40 transition-all duration-200">Projects</a>
        <a routerLink="/" fragment="services" class="px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/40 transition-all duration-200">Services</a>
        <a routerLink="/" fragment="ai-playground" class="px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/40 transition-all duration-200">AI Playground</a>
        <a routerLink="/architecture" routerLinkActive="text-blue-400 bg-slate-800/40" class="px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/40 transition-all duration-200">Architecture</a>
      </nav>

      <!-- Contact CTA -->
      <div class="hidden md:flex items-center">
        <a routerLink="/" fragment="contact" class="inline-flex items-center justify-center px-4 py-2 rounded-lg text-xs font-medium text-slate-100 bg-slate-900 border border-slate-800 hover:border-blue-500/40 hover:bg-slate-800/60 shadow-sm transition-all duration-300">
          Let's Talk
          <svg class="ml-2 -mr-0.5 h-3 w-3 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMobileMenu()" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-slate-100 hover:bg-slate-800/50 focus:outline-none" aria-controls="mobile-menu" [aria-expanded]="isMobileMenuOpen()">
          <span class="sr-only">Open main menu</span>
          <!-- Menu icon -->
          <svg [class.hidden]="isMobileMenuOpen()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <!-- Close icon -->
          <svg [class.hidden]="!isMobileMenuOpen()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div [class.hidden]="!isMobileMenuOpen()" class="md:hidden glass-panel border-t border-slate-800/80" id="mobile-menu">
    <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
      <a routerLink="/" fragment="about" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40">About</a>
      <a routerLink="/" fragment="skills" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40">Skills</a>
      <a routerLink="/" fragment="projects" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40">Projects</a>
      <a routerLink="/" fragment="services" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40">Services</a>
      <a routerLink="/" fragment="ai-playground" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40">AI Playground</a>
      <a routerLink="/architecture" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40">Architecture</a>
      <a routerLink="/" fragment="contact" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 bg-blue-500/10 text-blue-400 hover:bg-blue-500/20">Let's Talk</a>
    </div>
  </div>
</header>
